name: Verify GeoDjango ticket 33120 on MySQL
on:
  push:
    branches: [verify-33120-mysql]
permissions:
  contents: read
jobs:
  gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: GeoDjango on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.4", "mysql:9.7"]
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: django_test_only
          MYSQL_ROOT_HOST: "%"
        ports: ["33060:3306"]
        options: >-
          --health-cmd="if command -v mariadb-admin >/dev/null; then mariadb-admin ping --silent --host=127.0.0.1; else mysqladmin ping --silent --host=127.0.0.1; fi"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - name: Check out the contribution
        run: |
          git init .
          git fetch --depth=1 https://github.com/gabrielrbl/django.git b20882736452579ece291c9a48c003166cf74cd9
          git checkout --detach FETCH_HEAD
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgdal34t64 default-libmysqlclient-dev pkg-config python3-venv python3-dev
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e . mysqlclient Pillow tblib
      - name: Configure two disposable databases
        run: |
          cat > "$RUNNER_TEMP/ticket_mysql.py" <<'PY'
          from test_sqlite import PASSWORD_HASHERS, SECRET_KEY, USE_TZ
          DATABASES = {
              alias: {
                  "ENGINE": "django.contrib.gis.db.backends.mysql",
                  "NAME": "ticket33120_" + alias,
                  "USER": "root", "PASSWORD": "django_test_only",
                  "HOST": "127.0.0.1", "PORT": "33060",
              }
              for alias in ("default", "other")
          }
          PY
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import MySQLdb
          with MySQLdb.connect(host="127.0.0.1", port=33060, user="root", passwd="django_test_only") as conn:
              with conn.cursor() as cursor:
                  cursor.execute("CREATE DATABASE ticket33120_default")
                  cursor.execute("CREATE DATABASE ticket33120_other")
          PY
          git fetch --depth=1 https://github.com/django/django.git c67d872765e05ebd009fadf7de8d834b01bae9e4
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cat > "$RUNNER_TEMP/round3.py" <<'PY'
          import os
          import sys
          from django.conf import settings
          from ticket_mysql import DATABASES
          settings.configure(DATABASES=DATABASES, INSTALLED_APPS=["django.contrib.gis"], SECRET_KEY="test")
          import django
          django.setup()
          from django.db import connection, DatabaseError
          from django.contrib.gis.db import models
          from django.contrib.gis.gdal import SpatialReference
          from django.contrib.gis.geos import Point
          from django.contrib.gis.utils import add_srs_entry
          from django.db.models import F, Subquery, OuterRef
          
          class Place(models.Model):
              name = models.CharField(max_length=16)
              location = models.PointField()
              class Meta:
                  app_label="gis"
                  db_table="Round3 places"
          
          phase=sys.argv[1]
          def raw_rows():
              with connection.cursor() as c:
                  c.execute("SELECT name, ST_X(location), ST_Y(location), ST_SRID(location) FROM `Round3 places` ORDER BY id")
                  return list(c.fetchall())
          if phase=="write-old":
              with connection.schema_editor() as editor:
                  editor.create_model(Place)
              Place.objects.bulk_create([Place(name="legacy",location=Point(-43.2,-22.9,srid=4326)),Place(name="untouched",location=Point(15,30,srid=4326))])
              assert raw_rows()==[("legacy",-43.2,-22.9,0),("untouched",15,30,0)]
          elif phase=="update-new":
              assert Place.objects.get(name="legacy").location == Point(-43.2,-22.9,srid=4326)
              Place.objects.filter(name="legacy").update(location=Point(120,-45,srid=4326))
              Place.objects.create(name="new",location=Point(-170,80,srid=4326))
              assert list(Place.objects.filter(location=Point(120,-45,srid=4326)).values_list("name",flat=True)) == ["legacy"]
          elif phase=="read-old":
              assert raw_rows()==[("legacy",120,-45,0),("untouched",15,30,0),("new",-170,80,0)]
              assert [p.location.coords for p in Place.objects.order_by("id")] == [(120,-45),(15,30),(-170,80)]
              assert {p.location.srid for p in Place.objects.all()} == {4326}
          elif phase=="catalog":
              with connection.cursor() as c:
                  c.execute("SELECT VERSION(), @@SESSION.sql_mode")
                  print(c.fetchone(),flush=True)
                  c.execute("ALTER TABLE `Round3 places` ADD `Outra área` POLYGON SRID 3857")
              cols=connection.ops.geometry_columns().objects.filter(f_table_name=Place._meta.db_table)
              assert cols.count()==2
              schema=connection.settings_dict["NAME"]
              keys=[(schema,Place._meta.db_table,n) for n in ("location","Outra área")]
              assert {k:v.srid for k,v in cols.in_bulk(keys).items()}=={keys[0]:None, keys[1]:3857}
              row=cols.defer("srid","type").get(pk=keys[1])
              assert row.srid==3857 and row.type.lower()=="polygon"
              row.refresh_from_db()
              catalog=connection.ops.spatial_ref_sys().objects
              sub=catalog.filter(srid=OuterRef("srid")).values("auth_name")[:1]
              assert {n:a for n,a in cols.annotate(authority=Subquery(sub)).values_list("f_geometry_column","authority")}=={"location":None,"Outra área":"EPSG"}
              # The catalog stores both the SRS and its authority code as unsigned integers.
              i=3_000_033_120
              assert not catalog.filter(srid=i).exists()
              ref=SpatialReference(SpatialReference(4326).wkt.replace('AUTHORITY["EPSG","4326"]',f'AUTHORITY["Django","{i}"]'))
              assert ref.srid==i
              label="Projeção d'água 100% R3"
              with connection.cursor() as c:
                  c.execute("SET SESSION sql_mode = CONCAT_WS(',',NULLIF(@@SESSION.sql_mode,''),'NO_BACKSLASH_ESCAPES')")
              add_srs_entry(ref,auth_name="Round 3",auth_srid=4_000_000_000,ref_sys_name=label)
              entry=catalog.get(pk=i)
              assert entry.ref_sys_name==label and entry.auth_srid==4_000_000_000 and entry.geographic
              assert not catalog.filter(pk=i+1).exists()
              ref2=SpatialReference(ref.wkt.replace(str(i),str(i+1)))
              try:
                  add_srs_entry(ref2,auth_name="Round 3",ref_sys_name=label)
              except DatabaseError:
                  pass
              else:
                  raise AssertionError("Duplicate SRS name accepted")
              assert not catalog.filter(pk=i+1).exists()
              entry.refresh_from_db()
              assert entry.auth_srid==4_000_000_000 and entry.ref_sys_name==label
              with connection.cursor() as c:
                  c.execute("DROP SPATIAL REFERENCE SYSTEM %s",[i])
          else:
              raise AssertionError(phase)
          print("PASS",phase,flush=True)
          PY
      - name: Check an application table across an upgrade and rollback
        run: |
          for phase in write-old update-new read-old; do
            src="$PWD"
            if [ "$phase" != update-new ]; then src="$RUNNER_TEMP/base"; fi
            PYTHONPATH="$src:$src/tests:$RUNNER_TEMP" "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/round3.py" "$phase"
          done
      - name: Check ORM metadata queries, large IDs and registration error recovery
        run: |
          PYTHONPATH="$PWD:$PWD/tests:$RUNNER_TEMP" "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/round3.py" catalog
      - name: Run the candidate GeoDjango suite
        if: ${{ !cancelled() }}
        run: |
          cd tests
          PYTHONPATH="$RUNNER_TEMP:$PWD/.." "$RUNNER_TEMP/venv/bin/python" runtests.py --settings=ticket_mysql --parallel=1 --shuffle=9133120 gis_tests
      - name: Run the reference GeoDjango suite
        if: ${{ !cancelled() }}
        run: |
          cd "$RUNNER_TEMP/base/tests"
          PYTHONPATH="$RUNNER_TEMP:$PWD/.." "$RUNNER_TEMP/venv/bin/python" runtests.py --settings=ticket_mysql --parallel=1 --shuffle=9133120 gis_tests
